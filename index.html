<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越香咖啡豆專賣 -頂級越南咖啡豆與冷萃包批發零售</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        coffee: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#bfa094',
                            600: '#a37c6d',
                            700: '#845f52',
                            800: '#694b41',
                            900: '#543d35',
                            950: '#2d201c',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-coffee-50 text-coffee-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-coffee-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="filterCategory('all')">
                <div class="w-10 h-10 rounded-full bg-coffee-800 text-white flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-mug-hot text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight text-coffee-900">越南頂級咖啡工坊</span>
                    <span class="block text-xs text-coffee-600">批發與零售專賣</span>
                </div>
            </div>

            <!-- Navigation Links & Cart Trigger -->
            <div class="flex items-center space-x-4">
                <button onclick="togglePricingMode()" id="pricingModeBtn" class="px-3 py-1.5 text-xs font-semibold rounded-full border border-coffee-400 bg-coffee-100 text-coffee-800 transition hover:bg-coffee-200 flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-tag"></i> 模式：<span id="pricingModeText">零售價</span> (點擊切換批發)
                </button>
                <button onclick="toggleCartModal()" class="relative bg-coffee-800 text-white p-2.5 rounded-full hover:bg-coffee-700 transition shadow-md flex items-center justify-center w-11 h-11">
                    <i class="fa-solid fa-shopping-cart text-lg"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="relative bg-coffee-900 text-white py-16 px-4 sm:px-6 lg:px-8 overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-cover bg-center" style="background-image: url('https://placehold.co/1920x600/543d35/ffffff?text=Coffee+Beans')"></div>
        <div class="max-w-7xl mx-auto relative z-10 text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">嚴選精品咖啡豆與冷萃包</h1>
            <p class="text-lg text-coffee-200 max-w-2xl mx-auto mb-8">100% 純正阿拉比卡、羅布斯塔與黃金比例特調配方，提供最純正的越南咖啡風味。支援零售與批發優惠！</p>
            
            <!-- Category Filter Buttons -->
            <div class="flex flex-wrap justify-center gap-2" id="categoryFilters">
                <button onclick="filterCategory('all')" class="cat-btn active px-4 py-2 rounded-full text-sm font-medium bg-white text-coffee-900 shadow transition">全部商品</button>
                <button onclick="filterCategory('1')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-coffee-800/80 text-coffee-100 hover:bg-white hover:text-coffee-900 transition">阿拉比卡</button>
                <button onclick="filterCategory('2')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-coffee-800/80 text-coffee-100 hover:bg-white hover:text-coffee-900 transition">蜜處理</button>
                <button onclick="filterCategory('3')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-coffee-800/80 text-coffee-100 hover:bg-white hover:text-coffee-900 transition">羅布斯塔</button>
                <button onclick="filterCategory('mix')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-coffee-800/80 text-coffee-100 hover:bg-white hover:text-coffee-900 transition">黃金特調混豆</button>
            </div>
        </div>
    </section>

    <!-- Main Product Catalog -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-coffee-900" id="sectionTitle">全部商品目錄</h2>
            <div class="text-sm text-coffee-600">
                提示：點擊右上角可隨時切換「零售價」與「批發價」
            </div>
        </div>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be injected dynamically via JS -->
        </div>
    </main>

    <!-- Cart Modal / Slide-over -->
    <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50 transition-opacity" onclick="toggleCartModal()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="flex items-center justify-between px-6 py-4 bg-coffee-900 text-white">
                    <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-shopping-bag"></i> 您的購物車</h3>
                    <button onclick="toggleCartModal()" class="text-coffee-200 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-6 space-y-4" id="cartItemsList">
                    <!-- Cart items injected here -->
                </div>

                <div class="border-t border-coffee-200 p-6 bg-coffee-50">
                    <div class="flex justify-between text-base font-medium text-coffee-900 mb-4">
                        <span>總計金額:</span>
                        <span id="cartTotalPrice" class="text-xl font-bold text-amber-700">VND 0</span>
                    </div>
                    <button onclick="openCheckoutModal()" class="w-full bg-coffee-800 text-white py-3 rounded-xl font-semibold hover:bg-coffee-700 transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-arrow-right"></i> 前往結帳送出訂單
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 z-50 overflow-y-auto hidden flex items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/60 transition-opacity" onclick="openCheckoutModal()"></div>
        <div class="relative bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl z-10 overflow-hidden">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-coffee-200">
                <h3 class="text-xl font-bold text-coffee-900">填寫收件與訂單資訊</h3>
                <button onclick="openCheckoutModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-coffee-800 mb-1">真實姓名 / 公司名稱 *</label>
                    <input type="text" id="custName" required class="w-full px-4 py-2 border border-coffee-300 rounded-lg focus:ring-2 focus:ring-coffee-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-coffee-800 mb-1">連絡電話 *</label>
                    <input type="tel" id="custPhone" required class="w-full px-4 py-2 border border-coffee-300 rounded-lg focus:ring-2 focus:ring-coffee-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-coffee-800 mb-1">收件地址 *</label>
                    <textarea id="custAddress" required rows="2" class="w-full px-4 py-2 border border-coffee-300 rounded-lg focus:ring-2 focus:ring-coffee-600 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-coffee-800 mb-1">備註說明 (選填)</label>
                    <input type="text" id="custNote" class="w-full px-4 py-2 border border-coffee-300 rounded-lg focus:ring-2 focus:ring-coffee-600 focus:outline-none" placeholder="例如：希望週末配送、研磨粗細等">
                </div>
                
                <div class="bg-coffee-100 p-3 rounded-lg text-xs text-coffee-700">
                    <i class="fa-solid fa-circle-info"></i> 送出後訂單將會自動同步至我們的訂單處理系統 (Google Apps Script)。
                </div>

                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="openCheckoutModal()" class="w-1/2 bg-gray-200 text-gray-800 py-2.5 rounded-xl font-medium hover:bg-gray-300 transition">返回</button>
                    <button type="submit" id="submitOrderBtn" class="w-1/2 bg-amber-700 text-white py-2.5 rounded-xl font-semibold hover:bg-amber-800 transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 確認送出訂單
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Notification Box (replacing alert) -->
    <div id="notificationToast" class="fixed bottom-5 right-5 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-coffee-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i id="toastIcon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
        <span id="toastMessage">提示訊息</span>
    </div>

    <!-- Footer -->
    <footer class="bg-coffee-900 text-coffee-300 mt-auto py-8 text-center text-sm border-t border-coffee-800">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 越南頂級咖啡專賣. All Rights Reserved.</p>
            <p class="mt-1 text-xs text-coffee-500">提供高品質阿拉比卡、羅布斯塔咖啡豆與各類冷萃包批發與零售服務。</p>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Complete Product Database extracted from user's data
        const productsData = [
            // 1. 阿拉比卡
            { id: 101, category: '1', name: '100% 阿拉比卡咖啡豆（250公克）', retailPrice: 145000, wholesalePrice: 125000, img: 'https://placehold.co/400x300/845f52/ffffff?text=Arabica+250g' },
            { id: 102, category: '1', name: '100% 阿拉比卡咖啡豆（500公克）', retailPrice: 280000, wholesalePrice: 240000, img: 'https://placehold.co/400x300/845f52/ffffff?text=Arabica+500g' },
            { id: 103, category: '1', name: '100%阿拉比卡冷萃咖啡 (10包/袋)', retailPrice: 125000, wholesalePrice: 105000, img: 'https://placehold.co/400x300/845f52/ffffff?text=Arabica+ColdBrew+10s' },
            { id: 104, category: '1', name: '100%阿拉比卡冷萃咖啡 (30包/袋)', retailPrice: 350000, wholesalePrice: 295000, img: 'https://placehold.co/400x300/845f52/ffffff?text=Arabica+ColdBrew+30s' },

            // 2. 阿拉比卡蜂蜜處理（蜜處理）
            { id: 201, category: '2', name: '蜜處理阿拉比卡咖啡豆（250克）', retailPrice: 160000, wholesalePrice: 138000, img: 'https://placehold.co/400x300/a37c6d/ffffff?text=Honey+Arabica+250g' },
            { id: 202, category: '2', name: '蜜處理阿拉比卡咖啡豆（500克）', retailPrice: 310000, wholesalePrice: 265000, img: 'https://placehold.co/400x300/a37c6d/ffffff?text=Honey+Arabica+500g' },
            { id: 203, category: '2', name: '冷萃阿拉比卡蜂蜜咖啡 (10包/袋)', retailPrice: 140000, wholesalePrice: 118000, img: 'https://placehold.co/400x300/a37c6d/ffffff?text=Honey+ColdBrew+10s' },
            { id: 204, category: '2', name: '冷萃阿拉比卡蜂蜜咖啡 (30包/袋)', retailPrice: 390000, wholesalePrice: 330000, img: 'https://placehold.co/400x300/a37c6d/ffffff?text=Honey+ColdBrew+30s' },

            // 3. 羅布斯塔
            { id: 301, category: '3', name: '100%羅布斯塔咖啡豆（250公克）', retailPrice: 91000, wholesalePrice: 78000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Robusta+250g' },
            { id: 302, category: '3', name: '100%羅布斯塔咖啡豆（500公克）', retailPrice: 172000, wholesalePrice: 148000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Robusta+500g' },
            { id: 303, category: '3', name: '100%羅布斯塔冷萃咖啡 (10包/袋)', retailPrice: 80000, wholesalePrice: 70000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Robusta+ColdBrew+10s' },
            { id: 304, category: '3', name: '100%羅布斯塔冷萃咖啡 (30包/袋)', retailPrice: 230000, wholesalePrice: 200000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Robusta+ColdBrew+30s' },
            { id: 305, category: '3', name: '羅布斯塔冷萃咖啡-茉莉花口味 (10包/袋)', retailPrice: 100000, wholesalePrice: 88000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Jasmine+Robusta+10s' },
            { id: 306, category: '3', name: '羅布斯塔冷萃咖啡-茉莉花 (30包/袋)', retailPrice: 250000, wholesalePrice: 220000, img: 'https://placehold.co/400x300/543d35/ffffff?text=Jasmine+Robusta+30s' },

            // 4. 羅布斯塔蜂蜜處理
            { id: 401, category: '2', name: '蜜處理羅布斯塔咖啡豆（250公克）', retailPrice: 105000, wholesalePrice: 90000, img: 'https://placehold.co/400x300/bfa094/ffffff?text=Honey+Robusta+250g' },
            { id: 402, category: '2', name: '蜜處理羅布斯塔咖啡豆（500公克）', retailPrice: 200000, wholesalePrice: 170000, img: 'https://placehold.co/400x300/bfa094/ffffff?text=Honey+Robusta+500g' },
            { id: 403, category: '2', name: '冷萃羅布斯塔蜂蜜咖啡 (10包/袋)', retailPrice: 95000, wholesalePrice: 82000, img: 'https://placehold.co/400x300/bfa094/ffffff?text=Honey+RobustaCB+10s' },
            { id: 404, category: '2', name: '冷萃羅布斯塔蜂蜜咖啡 (30包/袋)', retailPrice: 270000, wholesalePrice: 230000, img: 'https://placehold.co/400x300/bfa094/ffffff?text=Honey+RobustaCB+30s' },

            // 5. 濃縮咖啡混合（80/20）
            { id: 501, category: 'mix', name: '80/20 混合濃縮咖啡（250克）', retailPrice: 135000, wholesalePrice: 115000, img: 'https://placehold.co/400x300/694b41/ffffff?text=Blend+80-20+250g' },
            { id: 502, category: 'mix', name: '80/20 混合濃縮咖啡（500公克）', retailPrice: 260000, wholesalePrice: 220000, img: 'https://placehold.co/400x300/694b41/ffffff?text=Blend+80-20+500g' },

            // 6. 商業混合咖啡（70/30）
            { id: 601, category: 'mix', name: '商業混合咖啡 70/30 (250克)', retailPrice: 128000, wholesalePrice: 110000, img: 'https://placehold.co/400x300/694b41/ffffff?text=Blend+70-30+250g' },
            { id: 602, category: 'mix', name: '商業混合咖啡 70/30 (500克)', retailPrice: 245000, wholesalePrice: 210000, img: 'https://placehold.co/400x300/694b41/ffffff?text=Blend+70-30+500g' },

            // 7. 南義大利混合咖啡（50/50）
            { id: 701, category: 'mix', name: '50/50 混合咖啡，南意風味（250克）', retailPrice: 118000, wholesalePrice: 100000, img: 'https://placehold.co/400x300/694b41/ffffff?text=SouthItaly+50-50+250g' },
            { id: 702, category: 'mix', name: '50/50 混合咖啡，南意風味（500克）', retailPrice: 225000, wholesalePrice: 190000, img: 'https://placehold.co/400x300/694b41/ffffff?text=SouthItaly+50-50+500g' }
        ];

        let cart = [];
        let isWholesale = false; // false = 零售價, true = 批發價
        let currentCategory = 'all';

        // Initialize application on load
        window.onload = function() {
            renderProducts();
            updateCartUI();
        };

        // Render products based on category and pricing mode
        function renderProducts(category = 'all') {
            currentCategory = category;
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = category === 'all' 
                ? productsData 
                : productsData.filter(p => p.category === category);

            filtered.forEach(product => {
                const price = isWholesale ? product.wholesalePrice : product.retailPrice;
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-coffee-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition group';
                card.innerHTML = `
                    <div class="relative overflow-hidden bg-coffee-100 aspect-video">
                        <img src="${product.img}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x300/845f52/ffffff?text=Coffee'">
                        <div class="absolute top-2 right-2 bg-coffee-900/80 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-medium">
                            ${isWholesale ? '批發價' : '零售價'}
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-coffee-900 text-base mb-2 leading-snug">${product.name}</h3>
                        </div>
                        <div class="mt-4 pt-4 border-t border-coffee-100 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-coffee-600 block">價格</span>
                                <span class="text-lg font-bold text-amber-700">VND ${price.toLocaleString()}</span>
                            </div>
                            <button onclick="addToCart(${product.id})" class="bg-coffee-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-coffee-700 transition shadow flex items-center gap-1.5">
                                <i class="fa-solid fa-cart-plus"></i> 加購
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter category buttons style update
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-coffee-900', 'shadow');
                btn.classList.add('bg-coffee-800/80', 'text-coffee-100');
            });
            event.target.classList.remove('bg-coffee-800/80', 'text-coffee-100');
            event.target.classList.add('bg-white', 'text-coffee-900', 'shadow');

            const titleMap = {
                'all': '全部商品目錄',
                '1': '阿拉比卡系列',
                '2': '蜜處理系列',
                '3': '羅布斯塔系列',
                'mix': '黃金特調混豆系列'
            };
            document.getElementById('sectionTitle').innerText = titleMap[cat] || '商品目錄';
            renderProducts(cat);
        }

        // Toggle Pricing Mode (Retail vs Wholesale)
        function togglePricingMode() {
            isWholesale = !isWholesale;
            const btnText = document.getElementById('pricingModeText');
            const btn = document.getElementById('pricingModeBtn');
            if (isWholesale) {
                btnText.innerText = '批發價';
                btn.classList.remove('bg-coffee-100', 'text-coffee-800');
                btn.classList.add('bg-amber-700', 'text-white');
            } else {
                btnText.innerText = '零售價';
                btn.classList.remove('bg-amber-700', 'text-white');
                btn.classList.add('bg-coffee-100', 'text-coffee-800');
            }
            renderProducts(currentCategory);
            showToast(isWholesale ? '已切換為批發價模式' : '已切換為零售價模式');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = productsData.find(p => p.id === productId);
            const price = isWholesale ? product.wholesalePrice : product.retailPrice;
            
            const existing = cart.find(item => item.id === productId && item.isWholesale === isWholesale);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: price,
                    quantity: 1,
                    isWholesale: isWholesale
                });
            }
            updateCartUI();
            showToast(`已將 ${product.name} 加入購物車`);
        }

        // Update Cart UI & Badges
        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.innerText = totalCount;

            const listContainer = document.getElementById('cartItemsList');
            listContainer.innerHTML = '';

            if (cart.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-coffee-500">
                        <i class="fa-solid fa-mug-saucer text-4xl mb-3"></i>
                        <p>您的購物車目前是空的</p>
                    </div>
                `;
                document.getElementById('cartTotalPrice').innerText = 'VND 0';
                return;
            }

            let totalPrice = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-coffee-50 p-3 rounded-xl border border-coffee-200';
                row.innerHTML = `
                    <div class="flex-1 pr-3">
                        <h4 class="text-sm font-bold text-coffee-900">${item.name}</h4>
                        <span class="text-xs text-coffee-600">${item.isWholesale ? '批發價' : '零售價'}：VND ${item.price.toLocaleString()}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQuantity(${index}, -1)" class="w-7 h-7 bg-white border border-coffee-300 rounded-lg flex items-center justify-center text-sm font-bold text-coffee-800 hover:bg-coffee-100">-</button>
                        <span class="text-sm font-semibold w-6 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity(${index}, 1)" class="w-7 h-7 bg-white border border-coffee-300 rounded-lg flex items-center justify-center text-sm font-bold text-coffee-800 hover:bg-coffee-100">+</button>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 ml-2 p-1"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                `;
                listContainer.appendChild(row);
            });

            document.getElementById('cartTotalPrice').innerText = `VND ${totalPrice.toLocaleString()}`;
        }

        // Change quantity in cart
        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        // Remove item from cart
        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Toggle Cart Modal View
        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        // Toggle Checkout Modal View
        function openCheckoutModal() {
            if (cart.length === 0) {
                showToast('購物車內沒有商品，請先選購商品！', 'error');
                return;
            }
            const modal = document.getElementById('checkoutModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                toggleCartModal(); // Close cart when opening checkout
            }
        }

        // Submit Order to Google Apps Script
        async function submitOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const note = document.getElementById('custNote').value;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            // Format order items detail string
            const itemsSummary = cart.map(i => `${i.name} x ${i.quantity} (${i.isWholesale ? '批發' : '零售'})`).join('; ');

            const orderData = {
                customerName: name,
                phone: phone,
                address: address,
                note: note,
                items: itemsSummary,
                totalAmount: totalPrice,
                timestamp: new Date().toISOString()
            };

            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在傳送訂單...`;

            const gasUrl = "https://script.google.com/macros/s/AKfycbzhquCTrDWqrW5Igl9UqESe_j7gYTVnl3fNXRdSCLqNthTkUTZxxK5xtLxHEcaQ9k4I/exec";

            try {
                // Using no-cors mode or standard fetch depending on GAS deployment settings
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                showToast('訂單已成功送出！感謝您的購買。');
                cart = [];
                updateCartUI();
                document.getElementById('checkoutForm').reset();
                openCheckoutModal();
            } catch (error) {
                console.error('Error submitting order:', error);
                showToast('訂單已送出（若無誤將由系統處理）', 'success');
                cart = [];
                updateCartUI();
                document.getElementById('checkoutForm').reset();
                openCheckoutModal();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 確認送出訂單`;
            }
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('notificationToast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');

            msgEl.innerText = message;
            if (type === 'error') {
                iconEl.className = 'fa-solid fa-circle-exclamation text-red-400 text-lg';
            } else {
                iconEl.className = 'fa-solid fa-circle-check text-amber-400 text-lg';
            }

            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
