        setLang(prev => prev === 'zh-TW' ? 'vi' : 'zh-TW');
      };

      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
          const name = lang === 'zh-TW' ? product.nameZh : product.nameVi;
          const matchesSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery, lang]);

      const handleAddToCart = (productToAdd) => {
        setCart(prev => {
          const cartKey = `${productToAdd.id}-${productToAdd.grind || 'default'}`;
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item => item.cartKey === cartKey ? { ...item, quantity: item.quantity + productToAdd.quantity } : item);
          }
          return [...prev, { ...productToAdd, cartKey }];
        });
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartKey === cartKey) {
            const product = products.find(p => p.id === item.id);
            const maxStock = product ? product.stock : 99;
            const newQty = item.quantity + delta;
            if (newQty > maxStock) return item;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const deductStock = (cartItems) => {
        setProducts(prevProducts => prevProducts.map(prod => {
          const itemsPurchased = cartItems.filter(item => item.id === prod.id);
          const totalDeduction = itemsPurchased.reduce((sum, item) => sum + item.quantity, 0);
          return totalDeduction > 0 ? { ...prod, stock: Math.max(0, prod.stock - totalDeduction) } : prod;
        }));
      };

      const clearCart = () => {
        setCart([]);
        localStorage.removeItem(CART_STORAGE_KEY);

    function PasswordPromptModal({ isOpen, title, desc, t, onClose, onSuccess }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === ADMIN_PASSWORD) {
          setError(false);
          setPassword('');
          onSuccess();
        } else {
          setError(true);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />

                  <p>• <strong className="font-semibold text-coffee-900">{t.altitude}：</strong>{product.altitude}</p>
                  <p>• <strong className="font-semibold text-coffee-900">{t.process}：</strong>{product.process}</p>
                  <p>• <strong className="font-semibold text-coffee-900">{t.grade}：</strong>{product.grade}</p>
                  <p>• <strong className="font-semibold text-coffee-900">{t.flavor}：</strong>{product.flavor}</p>
                </div>
              </div>
            ) : isDripBag ? (
              <div className="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-4 space-y-2.5">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-900 font-serif">
                  <Icons.Package className="h-4 w-4 text-amber-700 flex-shrink-0" />
                  <span>濾掛包商品特色</span>
                </div>
                <div className="space-y-1.5 text-xs text-coffee-800 leading-relaxed">
                  <p>• {t.dripbagNotice}</p>
                  <p className="pt-1 text-amber-900 font-semibold">• <strong className="font-semibold">{t.flavor}：</strong>{product.flavor}</p>
                </div>
              </div>
            ) : isGiftBox ? (
              <div className="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-4 space-y-2.5">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-900 font-serif">
                  <Icons.Package className="h-4 w-4 text-amber-700 flex-shrink-0" />
                  <span>精緻禮盒組特色</span>
                </div>
                <div className="space-y-1.5 text-xs text-coffee-800 leading-relaxed">
                  <p>• {t.giftboxNotice}</p>
                  <p className="pt-1 text-amber-900 font-semibold">• <strong className="font-semibold">{t.flavor}：</strong>{product.flavor}</p>
                </div>
              </div>
            ) : (
              <div className="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-4 space-y-2.5">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-900 font-serif">
                  <Icons.Package className="h-4 w-4 text-amber-700 flex-shrink-0" />
                  <span>{t.coldbrewDetailTitle}</span>
                </div>
                <div className="space-y-1.5 text-xs text-coffee-800 leading-relaxed">
                  <p>• {t.coldbrewFeature1}</p>
                  <p>• {t.coldbrewFeature2}</p>
                  <p className="pt-1 text-amber-900 font-semibold">• <strong className="font-semibold">{t.flavor}：</strong>{product.flavor}</p>
                </div>
              </div>
            )}

            {/* Product Safety & Food Information Section */}
            <div className="bg-amber-50/50 border border-amber-200/60 rounded-2xl p-4 space-y-2">
              <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-900">
                <Icons.ShieldCheck className="h-4 w-4 text-amber-700 flex-shrink-0" />
                <span>{t.safetyInfoTitle}</span>
              </div>
              <div className="space-y-1 text-xs text-coffee-800/90 leading-relaxed">
                <p>• {t.safetyStorage}</p>
                <p>• {t.safetyCert}</p>
                <p>• {t.safetyUsage}</p>
              </div>
            </div>

            {/* Grind Size Selection only for coffee beans */}
            {isBeanProduct ? (
              <div className="space-y-2.5">
                <label className="text-xs font-bold uppercase text-coffee-800 flex items-center gap-1.5 tracking-wider"><Icons.Settings className="h-4 w-4" /> {t.grindSize}</label>
                <div className="grid grid-cols-2 gap-2.5">
                  {['beans', 'phin', 'espresso', 'pour_over'].map(key => (
                    <button
                      key={key}
                      onClick={() => setSelectedGrind(key)}
                      className={`p-3 rounded-2xl text-left border transition-all ${
                        selectedGrind === key 
                          ? 'bg-coffee-900 text-white border-coffee-900 shadow-md ring-2 ring-coffee-900/20' 
                          : 'bg-white text-coffee-800 border-coffee-200 hover:bg-coffee-50'
                      }`}
                    >
                      <div className="text-xs font-bold">{t.grindOptions[key].label}</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{t.grindOptions[key].detail}</div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="p-3.5 bg-coffee-50 rounded-2xl text-xs text-coffee-800 border border-coffee-200/60 font-medium">
                {isDripBag ? t.dripbagNotice : isGiftBox ? t.giftboxNotice : t.coldbrewNotice}
              </div>
            )}

            <div className="flex items-center justify-between pt-2">
              <span className="text-xs sm:text-sm font-bold text-coffee-900">{t.quantity}</span>
              <div className="flex items-center rounded-2xl border border-coffee-300 bg-white p-1.5 shadow-sm">
                <button onClick={() => setQuantity(q => Math.max(1, q - 1))} className="p-1.5 hover:bg-coffee-100 rounded-xl transition-colors"><Icons.Minus className="h-4 w-4" /></button>
                <span className="w-9 text-center text-sm font-bold">{quantity}</span>
                <button onClick={() => setQuantity(q => Math.min(maxStock, q + 1))} className="p-1.5 hover:bg-coffee-100 rounded-xl transition-colors"><Icons.Plus className="h-4 w-4" /></button>
              </div>
            </div>

            <button onClick={handleAdd} className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-xs sm:text-sm">
              <Icons.ShoppingBag className="h-4 w-4" /> {t.addToCart} • {(currentUnitPrice * quantity).toLocaleString()} VND
            </button>
          </div>
        </div>
      );
    }

    function CartDrawer({ isOpen, onClose, cart, updateQuantity, onOpenCheckout, t }) {
      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;
      const amountNeeded = Math.max(0, SHIPPING_CONFIG.FREE_THRESHOLD - subtotal);
      const progress = Math.min(100, (subtotal / SHIPPING_CONFIG.FREE_THRESHOLD) * 100);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 overflow-hidden">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="absolute inset-y-0 right-0 max-w-full flex">
            <div className="w-screen max-w-md bg-white text-coffee-900 shadow-2xl flex flex-col border-l border-coffee-200">
              <div className="p-5 sm:p-6 bg-coffee-900 text-coffee-100 flex items-center justify-between">
                <h2 className="text-base sm:text-xl font-bold flex items-center gap-2.5 font-serif"><Icons.ShoppingBag className="h-5 w-5 text-amber-200" /> {t.cart}</h2>
                <button onClick={onClose} className="p-2 hover:bg-coffee-800 rounded-full transition-colors text-coffee-200 hover:text-white"><Icons.X className="h-6 w-6" /></button>
              </div>

              <div className="bg-amber-50/80 p-4 border-b border-amber-200/60">
                <div className="flex items-center justify-between text-xs font-bold text-amber-900 mb-2">
                  <span className="flex items-center gap-1.5"><Icons.Truck className="h-4 w-4 text-amber-700" /> {t.freeShippingGoal}</span>
                  <span className="text-amber-800">{isFreeShipping ? t.freeShippingReached : `${t.freeShippingShort}${amountNeeded.toLocaleString()} VND`}</span>
                </div>
                <div className="w-full bg-amber-200/50 rounded-full h-2.5 overflow-hidden shadow-inner">
                  <div className="bg-amber-700 h-full transition-all duration-500 rounded-full" style={{ width: `${progress}%` }} />
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3.5">
                {cart.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-coffee-600 space-y-2">
                    <div className="bg-coffee-100 p-4 rounded-full text-coffee-400">
                      <Icons.ShoppingBag className="h-8 w-8" />
                    </div>
                    <p className="text-sm font-medium">{t.emptyCart}</p>
                  </div>
                ) : (
                  cart.map(item => {
                    const unitPrice = getUnitPrice(item);
                    return (
                      <div key={item.cartKey} className="p-4 bg-coffee-50/50 rounded-2xl shadow-sm border border-coffee-200/60 space-y-3">
                        <div className="flex items-start gap-3.5">
                          <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-2xl flex-shrink-0 shadow-sm border border-coffee-200/50" />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-coffee-900 text-xs sm:text-sm truncate">{item.name}</h4>
                            <p className="text-[11px] text-coffee-600 truncate mt-0.5">{item.spec} | {item.grindLabel}</p>
                            <div className="mt-1 flex items-center gap-2">
                              <span className="text-xs font-bold text-coffee-800">{unitPrice.toLocaleString()} VND</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-2.5 border-t border-coffee-200/40">
                          <div className="flex items-center gap-2 bg-white rounded-xl border border-coffee-200 p-1 shadow-sm">
                            <button onClick={() => updateQuantity(item.cartKey, -1)} className="p-1 hover:bg-coffee-100 rounded-lg transition-colors"><Icons.Minus className="h-3.5 w-3.5" /></button>
                            <span className="text-xs font-bold w-6 text-center">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.cartKey, 1)} className="p-1 hover:bg-coffee-100 rounded-lg transition-colors"><Icons.Plus className="h-3.5 w-3.5" /></button>
                          </div>
                          <div className="text-right font-bold text-xs text-coffee-900">{(unitPrice * item.quantity).toLocaleString()} VND</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {cart.length > 0 && (
                <div className="p-5 sm:p-6 bg-coffee-50 border-t border-coffee-200 space-y-4">
                  <div className="space-y-1.5 text-xs sm:text-sm text-coffee-700">
                    <div className="flex justify-between"><span>{t.subtotal}</span><span>{subtotal.toLocaleString()} VND</span></div>
                    <div className="flex justify-between"><span>{t.shippingFee}</span><span>{isFreeShipping ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                    <div className="flex justify-between font-bold text-base text-coffee-900 pt-3 border-t border-coffee-200">
                      <span>{t.total}</span><span className="text-lg text-amber-800">{grandTotal.toLocaleString()} VND</span>
                    </div>
                  </div>

                  <button onClick={onOpenCheckout} className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-xs sm:text-sm transition-all">
                    <Icons.Send className="h-4 w-4" /> {t.checkout}
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function CheckoutModal({ isOpen, onClose, cart, clearCart, products, deductStock, t, lang, onOpenReceipt }) {
      const [formData, setFormData] = useState({ fullName: '', phone: '', address: '', notes: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const [lastCreatedOrder, setLastCreatedOrder] = useState(null);

      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;

      const handleInputChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSubmitOrder = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const orderId = Date.now().toString().slice(-6);
        const orderDate = new Date().toLocaleString();

        const itemsSummary = cart.map(item => 
          `- ${item.name} (${item.spec}) [${item.grindLabel}] x ${item.quantity} ＝ ${(getUnitPrice(item) * item.quantity).toLocaleString()} VND`
        ).join('\n');

        const orderRecord = {
          id: orderId,
          date: orderDate,
          customerName: formData.fullName,
          phone: formData.phone,
          address: formData.address,
          notes: formData.notes,
          items: cart.map(item => ({
            name: item.name,
            spec: item.spec,
            grindLabel: item.grindLabel,
            quantity: item.quantity,
            unitPrice: getUnitPrice(item)
          })),
          subtotal,
          shippingFee,
          grandTotal
        };

        try {
          const scriptURL = 'https://script.google.com/macros/s/AKfycbxZ0lung4gdqyrYsCMJCprWCLhuGK6VDA-0qyCuLMlpmruVzfaXbuTpvtDmixRhx-cD6g/exec';
          
          await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              orderId,
              orderDate,
              fullName: formData.fullName,
              phone: formData.phone,
              address: formData.address,
              notes: formData.notes || '無',
              orderItems: itemsSummary,
              subtotal,
              shippingFee,
              grandTotal,
              restockNotice: '庫存顯示已關閉'
            })
          });

          deductStock(cart);
          const history = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
          localStorage.setItem(ORDER_HISTORY_STORAGE_KEY, JSON.stringify([orderRecord, ...history]));

          setLastCreatedOrder(orderRecord);
          setIsSubmitting(false);
          setIsSuccess(true);
          clearCart();

        } catch (error) {
          console.error('送出訂單失敗:', error);
          alert('發送失敗，請稍後再試。');
          setIsSubmitting(false);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 max-h-[95vh] overflow-y-auto z-10">
            <button onClick={onClose} className="absolute right-4 top-4 p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors z-10"><Icons.X className="h-5 w-5" /></button>

            {isSuccess ? (
              <div className="py-8 text-center space-y-4">
                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto shadow-inner border border-green-200">
                  <Icons.CheckCircle className="h-10 w-10 animate-bounce" />
                </div>
                <h3 className="text-xl sm:text-2xl font-bold font-serif text-coffee-900">{t.orderSuccess}</h3>
                <p className="text-xs sm:text-sm text-coffee-600 leading-relaxed">{t.orderSuccessDesc}</p>
                {lastCreatedOrder && (
                  <button
                    onClick={() => { onClose(); onOpenReceipt(lastCreatedOrder); }}
                    className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-sm mt-4 transition-all"
                  >
                    <Icons.FileText className="h-5 w-5" /> {t.printReceipt}
                  </button>
                )}
              </div>
            ) : (
              <form onSubmit={handleSubmitOrder} className="space-y-4">
                <h2 className="text-lg sm:text-2xl font-bold font-serif text-coffee-900 border-b border-gray-100 pb-3">{t.customerInfo}</h2>

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-coffee-800">{t.fullName}</label>
                  <input type="text" name="fullName" required value={formData.fullName} onChange={handleInputChange} className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner" />
                </div>

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-coffee-800">{t.phone}</label>
                  <input type="tel" name="phone" required value={formData.phone} onChange={handleInputChange} className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner" />
                </div>

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-coffee-800">{t.address}</label>
                  <input type="text" name="address" required value={formData.address} onChange={handleInputChange} className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner" />
                </div>

                <div className="space-y-1">
                  <label className="block text-xs font-bold text-coffee-800">{t.notes}</label>
                  <textarea name="notes" rows={2} value={formData.notes} onChange={handleInputChange} className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner" />
                </div>

                <div className="bg-amber-50/75 p-4 rounded-2xl border border-amber-200/60 space-y-1 text-sm font-bold text-coffee-900">
                  <div className="flex justify-between items-center">
                    <span className="text-xs uppercase tracking-wider text-amber-900">{t.payable}</span>
                    <span className="text-lg sm:text-xl text-amber-800">{grandTotal.toLocaleString()} VND</span>
                  </div>
                </div>

                <button type="submit" disabled={isSubmitting} className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-xs sm:text-sm disabled:opacity-50 transition-all">
                  <Icons.Send className="h-4 w-4" /> {isSubmitting ? t.submitting : t.submitOrder}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function OrderHistoryModal({ isOpen, onClose, t, onViewReceipt }) {
      const [history, setHistory] = useState([]);

      useEffect(() => {
        const saved = localStorage.getItem(ORDER_HISTORY_STORAGE_KEY);
        setHistory(saved ? JSON.parse(saved) : []);
      }, [isOpen]);

      const clearHistory = () => {
        if (confirm(t.confirmClear)) {
          localStorage.removeItem(ORDER_HISTORY_STORAGE_KEY);
          setHistory([]);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="relative w-full max-w-xl bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 max-h-[90vh] flex flex-col z-10">
            <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-4">
              <h2 className="text-base sm:text-xl font-bold font-serif text-coffee-900 flex items-center gap-2.5"><Icons.Package className="h-5 w-5 text-amber-800" /> {t.orderHistoryTitle}</h2>
              <div className="flex items-center gap-3">
                {history.length > 0 && (
                  <button onClick={clearHistory} className="text-xs text-red-600 hover:underline flex items-center gap-1 font-medium"><Icons.Trash className="h-3.5 w-3.5" /> {t.clearHistory}</button>
                )}
                <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 transition-colors"><Icons.X className="h-5 w-5" /></button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3.5 pr-1">
              {history.length === 0 ? (
                <p className="text-center py-12 text-xs sm:text-sm text-coffee-600">{t.noHistory}</p>
              ) : (
                history.map(item => (
                  <div key={item.id} className="bg-coffee-50/60 p-4 rounded-2xl border border-coffee-200/60 space-y-2.5 text-xs shadow-sm">
                    <div className="flex justify-between font-bold text-coffee-900">
                      <span className="bg-amber-100/70 text-amber-900 px-2.5 py-0.5 rounded-md border border-amber-200">{t.orderId}: #{item.id}</span>
                      <span className="text-coffee-600">{item.date}</span>
                    </div>
                    <div className="text-coffee-800 font-medium">{item.customerName} ({item.phone})</div>
                    <div className="bg-white p-2.5 rounded-xl border border-coffee-200/50 space-y-1">
                      {item.items.map((prod, idx) => (
                        <div key={idx} className="flex justify-between text-coffee-800">
                          <span className="truncate pr-2 font-medium">{prod.name} ({prod.spec}) - {prod.grindLabel}</span>
                          <span className="flex-shrink-0 text-gray-500">×{prod.quantity}</span>
                        </div>
                      ))}
                    </div>
                    <div className="flex justify-between items-center pt-2 border-t border-coffee-200/40">
                      <span className="font-bold text-sm text-amber-900">{item.grandTotal.toLocaleString()} VND</span>
                      <button
                        onClick={() => { onClose(); onViewReceipt(item); }}
                        className="px-3.5 py-2 bg-coffee-900 hover:bg-coffee-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm"
                      >
                        <Icons.Printer className="h-3.5 w-3.5" /> {t.viewReceipt}
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    if (container) {
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    }
  </script>
</body>
</html>
