<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>首頁 - index.html</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- CSS 樣式表連結 -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* 基礎 CSS 重置與頁面佈局 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #003366;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.5rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 1rem;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        /* 聯絡表單樣式 */
        .contact-section {
            margin-top: 2rem;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            background-color: #003366;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button[type="submit"]:hover {
            background-color: #002244;
        }
        footer {
            background-color: #222222;
            color: #cccccc;
            text-align: center;
            padding: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <!-- 頁頭與導覽列 -->
    <header>
        <div class="logo">
            <h1>網站名稱</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="#about">關於我們</a></li>
                <li><a href="#services">服務項目</a></li>
                <li><a href="#contact">聯絡我們</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主要內容區 -->
    <main>
        <section id="hero">
            <h2>歡迎來到我們的網站</h2>
            <p>這是網站的主要展示區域。</p>
        </section>
        
        <section id="content" style="margin-top: 2rem;">
            <h3>最新動態</h3>
            <p>在這裡放上您的主要內容、簡介或最新訊息。</p>
        </section>

        <!-- 聯絡表單區塊：設定接收端為 rick0960590177@gmail.com -->
        <section id="contact" class="contact-section">
            <h3>聯絡我們</h3>
            <form action="https://formspree.io/f/rick0960590177@gmail.com" method="POST">
                <div class="form-group">
                    <label for="name">姓名：</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">您的 Email：</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                <div class="form-group">
                    <label for="message">留言內容：</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">送出訊息</button>
            </form>
        </section>
    </main>

    <!-- 頁尾區 -->
    <footer>
        <p>&copy; 2026 版權所有 All Rights Reserved.</p>
    </footer>

    <!-- JavaScript 腳本連結 -->
    <script src="main.js"></script>
</body>
</html>
