<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VieBucks Coffee - 越南精品咖啡批發與零售</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 導覽列 -->
    <header class="bg-amber-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-mug-hot text-2xl text-amber-400"></i>
                <span class="text-xl font-bold tracking-wider">VieBucks Coffee</span>
            </div>
            <div class="flex items-center space-x-4">
                <button id="langToggle" class="bg-amber-800 hover:bg-amber-750 px-3 py-1 rounded text-sm border border-amber-700 transition">
                    🌐 中文 / Tiếng Việt
                </button>
                <div class="relative cursor-pointer" id="cartBtn">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 標題與篩選 -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-amber-900 mb-2">精選越南咖啡系列</h1>
            <p class="text-gray-600">頂級阿拉比卡、羅布斯塔與職人特調咖啡豆 / 冷萃包</p>
        </div>

        <!-- 產品列表格 -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 產品卡片將由 JS 動態渲染 -->
        </div>
    </main>

    <!-- 購物車抽屜 / 視窗 (簡單範例) -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-xl font-bold text-amber-900">購物車內容</h2>
                    <button id="closeCart" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
                </div>
                <div id="cartItemsList" class="space-y-4 overflow-y-auto max-h-[60vh]">
                    <!-- 購物車項目 -->
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4 font-bold text-lg">
                    <span>總計金額：</span>
                    <span id="cartTotalPrice" class="text-amber-700">0 VNĐ</span>
                </div>
                <button onclick="alert('訂單送出功能建置中')" class="w-full bg-amber-900 hover:bg-amber-800 text-white py-3 rounded-lg font-bold transition">
                    確認送出訂單
                </button>
            </div>
        </div>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        const PRODUCTS_STORAGE_KEY = 'viebucks_products_v1';
        let currentLang = 'zh'; // 'zh' 或 'vi'

        // 修正後的產品資料（使用正確的 Raw 網址）
        const INITIAL_PRODUCTS = [
          { 
            id: 'arabica-100-250g', 
            nameZh: '100% 精品阿拉比卡咖啡豆', 
            nameVi: 'Cà phê đặc sản Arabica 100%', 
            category: 'arabica', 
            specZh: '250公克', 
            specVi: '250g', 
            price: 145000, 
            wholesalePrice: 125000, 
            type: 'beans', 
            stock: 15, 
            image: 'https://raw.githubusercontent.com/rick0960590177/viebucks-coffee/main/images/P1.jpg',
            origin: '嚴選特定產區與小農莊園',
            flavor: '前段明亮果香，中段堅果與焦糖甜感'
          },
          { 
            id: 'arabica-coldbrew-10', 
            nameZh: '100% 精品阿拉比卡冷萃咖啡包', 
            nameVi: 'Cà phê ủ lạnh Arabica 100%', 
            category: 'coldbrew', 
            specZh: '10包/袋', 
            specVi: '10 Gói /Túi', 
            price: 125000, 
            wholesalePrice: 105000, 
            type: 'coldbrew', 
            stock: 20, 
            image: 'https://raw.githubusercontent.com/rick0960590177/viebucks-coffee/main/images/P4.jpg',
            origin: '嚴選單一產區阿拉比卡豆種',
            flavor: '淺焙果酸花香、中焙焦糖甜感'
          },
          { 
            id: 'robusta-100-250g', 
            nameZh: '100% 精品羅布斯塔咖啡豆', 
            nameVi: 'Cà phê đặc sản Robusta 100%', 
            category: 'robusta', 
            specZh: '250公克', 
            specVi: '250g', 
            price: 91000, 
            wholesalePrice: 78000, 
            type: 'beans', 
            stock: 25, 
            image: 'https://raw.githubusercontent.com/rick0960590177/viebucks-coffee/main/images/P2.jpg',
            origin: '精選頂級羅布斯塔莊園',
            flavor: '醇厚濃郁、帶有黑可可與麥香'
          },
          { 
            id: 'robusta-coldbrew-10', 
            nameZh: '100% 精品羅布斯塔冷萃咖啡包', 
            nameVi: 'Cà phê ủ lạnh Robusta 100%', 
            category: 'coldbrew', 
            specZh: '10包/袋', 
            specVi: '10 Gói /Túi', 
            price: 100000, 
            wholesalePrice: 88000, 
            type: 'coldbrew', 
            stock: 20, 
            image: 'https://raw.githubusercontent.com/rick0960590177/viebucks-coffee/main/images/P3.jpg',
            origin: '嚴選單一產區羅布斯塔豆種',
            flavor: '口感厚實濃郁、低酸回甘'
          },
          { 
            id: 'blend-8020-250g', 
            nameZh: '80/20 義式特調咖啡豆', 
            nameVi: 'Cà phê phối trộn Blend 80/20 Espresso', 
            category: 'blend', 
            specZh: '250公克', 
            specVi: '250g', 
            price: 135000, 
            wholesalePrice: 115000, 
            type: 'beans', 
            stock: 15, 
            image: 'https://raw.githubusercontent.com/rick0960590177/viebucks-coffee/main/images/P5.jpg',
            origin: '阿拉比卡（80%）與羅布斯塔（20%）',
            flavor: '兼具優雅香氣與豐富油脂、濃厚Crema'
          }
        ];

        let products = JSON.parse(localStorage.getItem(PRODUCTS_STORAGE_KEY)) || INITIAL_PRODUCTS;
        let cart = [];

        // 初始化渲染
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(p => {
                const name = currentLang === 'zh' ? p.nameZh : p.nameVi;
                const spec = currentLang === 'zh' ? p.specZh : p.specVi;
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <img src="${p.image}" alt="${name}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                        <div class="p-4">
                            <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded font-semibold uppercase">${p.category}</span>
                            <h3 class="font-bold text-lg text-gray-800 mt-2">${name}</h3>
                            <p class="text-sm text-gray-500 mt-1">${spec} | ${p.origin}</p>
                            <p class="text-xs text-gray-600 mt-2 bg-gray-50 p-2 rounded">${p.flavor}</p>
                        </div>
                    </div>
                    <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                        <div>
                            <span class="text-amber-800 font-bold text-lg">${p.price.toLocaleString()} VNĐ</span>
                        </div>
                        <button onclick="addToCart('${p.id}')" class="bg-amber-900 hover:bg-amber-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                            ${currentLang === 'zh' ? '加入購物車' : 'Thêm vào giỏ'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                const name = currentLang === 'zh' ? item.nameZh : item.nameVi;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center border-b pb-2';
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-sm">${name}</h4>
                        <p class="text-xs text-gray-500">${item.price.toLocaleString()} VNĐ x ${item.qty}</p>
                    </div>
                    <span class="font-bold text-amber-900">${(item.price * item.qty).toLocaleString()} VNĐ</span>
                `;
                list.appendChild(div);
            });

            document.getElementById('cartTotalPrice').innerText = total.toLocaleString() + ' VNĐ';
        }

        // 語言切換按鈕事件
        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'zh' ? 'vi' : 'zh';
            renderProducts();
            updateCartUI();
        });

        // 購物車互動
        document.getElementById('cartBtn').addEventListener('click', () => {
            document.getElementById('cartModal').classList.remove('hidden');
        });
        document.getElementById('closeCart').addEventListener('click', () => {
            document.getElementById('cartModal').classList.add('hidden');
        });

        // 初次載入
        renderProducts();
    </script>
</body>
</html>
