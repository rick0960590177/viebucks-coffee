<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEBUCKS | 精品咖啡品牌官網 & 電商</title>
  <!-- Google Fonts: Inter & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ===== 全局與變數設定 ===== */
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --accent-gold: #c9a063;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
      --border-color: #2c2c2e;
      --font-serif: 'Noto Serif TC', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== 導覽列 (Navbar) ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-gold);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a:hover {
      color: var(--accent-gold);
      transition: color 0.3s;
    }

    .cart-icon {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      transition: border-color 0.3s;
    }

    .cart-icon:hover {
      border-color: var(--accent-gold);
    }

    .cart-badge {
      background: var(--accent-gold);
      color: var(--bg-dark);
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 7px;
    }

    /* ===== Hero 區塊 ===== */
    .hero {
      height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(18,18,18,1)), 
                  url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      padding: 0 1rem;
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: 2.8rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      background: var(--accent-gold);
      color: var(--bg-dark);
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: opacity 0.3s;
      text-align: center;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .btn-zalo {
      background: #0068ff;
      color: #fff;
    }

    .btn-gmail {
      background: #ea4335;
      color: #fff;
    }

    /* ===== 主容器佈局 ===== */
    .main-layout {
      max-width: 1200px;
      margin: 3rem auto;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 2.5rem;
      padding: 0 2rem;
    }

    /* ===== 側邊風味篩選器 ===== */
    .filter-sidebar {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      height: fit-content;
    }

    .filter-group {
      margin-bottom: 1.8rem;
    }

    .filter-group h3 {
      font-size: 1rem;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.4rem;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-option input {
      accent-color: var(--accent-gold);
    }

    /* ===== 商品列表區塊 ===== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, border-color 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-gold);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .flavor-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.6rem 0;
    }

    .tag {
      font-size: 0.75rem;
      background: #2a2a2d;
      color: var(--accent-gold);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: auto;
      margin-bottom: 1rem;
    }

    /* ===== 側滑購物車面板 (Drawer Cart) ===== */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .cart-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -450px;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: var(--bg-card);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease-in-out;
      border-left: 1px solid var(--border-color);
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-family: var(--font-serif);
      font-size: 1.3rem;
    }

    .close-cart {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .cart-item-price {
      color: var(--accent-gold);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-btn {
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: justify;
      align-items: center;
      justify-content: center;
    }

    .remove-item {
      background: none;
      border: none;
      color: #ff5555;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-dark);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
    }

    /* ===== 電子彈出單據 Modal ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .invoice-box {
      background: #121212;
      border: 1px dashed var(--border-color);
      padding: 1rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #e0e0e0;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      margin: 1rem 0;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    /* ===== 頁尾 (Footer) ===== */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
    }

    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; }
      .cart-drawer { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 導覽列 -->
  <header>
    <div class="nav-container">
      <div class="logo">VIEBUCKS</div>
      <ul class="nav-links">
        <li><a href="#shop">線上商店</a></li>
        <li><a href="#story">品牌故事</a></li>
      </ul>
      <div class="cart-icon" onclick="openCart()">
        🛒 購物車
        <span class="cart-badge" id="cart-badge">0</span>
      </div>
    </div>
  </header>

  <!-- Hero 區塊 -->
  <section class="hero">
    <h1>從微小的豆表細節，淬鍊出極致饗宴</h1>
    <p>VIEBUCKS 嚴選全球頂級莊園微批次生豆，匠人烘焙，為追求極致風味的咖啡玩家而生。</p>
    <a href="#shop" class="btn">探索精品咖啡豆</a>
  </section>

  <!-- 主內容區：商品與篩選器 -->
  <div class="main-layout" id="shop">
    <!-- 左側篩選器 -->
    <aside class="filter-sidebar">
      <div class="filter-group">
        <h3>風味主調 (Flavor)</h3>
        <label class="filter-option"><input type="checkbox" value="花香/柑橘" onchange="filterProducts()"> 🌸 花香/柑橘</label>
        <label class="filter-option"><input type="checkbox" value="亮麗果香" onchange="filterProducts()"> 🍇 亮麗果香</label>
        <label class="filter-option"><input type="checkbox" value="堅果/可可" onchange="filterProducts()"> 🌰 堅果/可可</label>
        <label class="filter-option"><input type="checkbox" value="酒香/發酵" onchange="filterProducts()"> 🍷 酒香/發酵</label>
      </div>

      <div class="filter-group">
        <h3>烘焙程度 (Roast)</h3>
        <label class="filter-option"><input type="checkbox" value="淺焙" onchange="filterProducts()"> 淺焙 (Light)</label>
        <label class="filter-option"><input type="checkbox" value="中焙" onchange="filterProducts()"> 中焙 (Medium)</label>
        <label class="filter-option"><input type="checkbox" value="深焙" onchange="filterProducts()"> 深焙 (Dark)</label>
      </div>
    </aside>

    <!-- 右側商品展示區 -->
    <main class="product-grid" id="product-container"></main>
  </div>

  <!-- 側滑購物車 (Drawer Cart) -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>您的購物車</h2>
      <button class="close-cart" onclick="closeCart()">&times;</button>
    </div>
    
    <div class="cart-items" id="cart-items-container"></div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>總計金額</span>
        <span id="cart-total-price" style="color: var(--accent-gold);">NT$ 0</span>
      </div>
      <div class="cart-actions">
        <button class="btn" onclick="generateInvoice()">前往結帳（生成單據）</button>
        <button class="btn btn-secondary" onclick="clearCart()">清空購物車</button>
      </div>
    </div>
  </div>

  <!-- 電子單據 Modal -->
  <div class="modal-overlay" id="invoice-modal">
    <div class="modal-card">
      <h3 style="color: var(--accent-gold); font-family: var(--font-serif);">📄 VIEBUCKS 電子訂單單據</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">單據已自動生成，請複製明細或透過以下管道傳送給客服：</p>
      
      <div class="invoice-box" id="invoice-text"></div>

      <div class="modal-actions">
        <button class="btn" onclick="copyInvoiceText()">📋 一鍵複製訂單內文</button>
        <button class="btn btn-gmail" onclick="sendToGmail()">✉️ 透過 Gmail 傳送訂單</button>
        <button class="btn btn-zalo" onclick="sendToZalo()">💬 開啟 Zalo 貼上發送</button>
        <button class="btn btn-secondary" onclick="closeInvoiceModal()">關閉視窗</button>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer>
    <p>&copy; 2026 VIEBUCKS Specialty Coffee. All Rights Reserved.</p>
  </footer>

  <!-- JavaScript 邏輯 -->
  <script>
    // 店家與客服設定
    const STORE_EMAIL = "order@viebucks.com"; // 您的接收訂單 Email
    const ZALO_PHONE = "0912345678";          // 您的 Zalo / 電話號碼

    // 1. 商品資料庫
    const products = [
      {
        id: 1,
        title: "衣索比亞 耶加雪菲",
        roast: "淺焙",
        price: 480,
        flavors: ["花香/柑橘", "亮麗果香"],
        img: "https://images.unsplash.com/photo-1587734195503-904fca47e0e9?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "哥倫比亞 蕙蘭 厭氧發酵",
        roast: "淺焙",
        price: 550,
        flavors: ["酒香/發酵", "亮麗果香"],
        img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "VIEBUCKS 招牌義式配方豆",
        roast: "中焙",
        price: 420,
        flavors: ["堅果/可可"],
        img: "https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "瓜地馬拉 安提瓜 深焙",
        roast: "深焙",
        price: 450,
        flavors: ["堅果/可可"],
        img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];
    let currentInvoiceString = "";

    // 渲染商品
    function renderProducts(items) {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">沒有找到符合條件的商品。</p>';
        return;
      }

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        const tagsHtml = [p.roast, ...p.flavors].map(tag => `<span class="tag">#${tag}</span>`).join('');

        card.innerHTML = `
          <img src="${p.img}" alt="${p.title}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.title}</div>
            <div class="flavor-tags">${tagsHtml}</div>
            <div class="product-price">NT$ ${p.price}</div>
            <button class="btn" onclick="addToCart(${p.id})">加入購物車</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 篩選器
    function filterProducts() {
      const checkedBoxes = Array.from(document.querySelectorAll('.filter-sidebar input[type="checkbox"]:checked'))
                               .map(cb => cb.value);

      if (checkedBoxes.length === 0) {
        renderProducts(products);
        return;
      }

      const filtered = products.filter(p => {
        const productTraits = [p.roast, ...p.flavors];
        return checkedBoxes.some(trait => productTraits.includes(trait));
      });

      renderProducts(filtered);
    }

    // 購物車操作
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const cartItem = cart.find(item => item.product.id === productId);

      if (cartItem) {
        cartItem.quantity += 1;
      } else {
        cart.push({ product, quantity: 1 });
      }

      updateCartUI();
      openCart();
    }

    function updateQuantity(productId, delta) {
      const cartItem = cart.find(item => item.product.id === productId);
      if (!cartItem) return;

      cartItem.quantity += delta;
      if (cartItem.quantity <= 0) {
        removeFromCart(productId);
      } else {
        updateCartUI();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.product.id !== productId);
      updateCartUI();
    }

    function clearCart() {
      cart = [];
      updateCartUI();
    }

    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cart-items-container');
      const badge = document.getElementById('cart-badge');
      const totalPriceEl = document.getElementById('cart-total-price');

      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.innerText = totalCount;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top:3rem;">購物車目前是空的 ☕</div>';
        totalPriceEl.innerText = 'NT$ 0';
        return;
      }

      cartItemsContainer.innerHTML = '';
      let grandTotal = 0;

      cart.forEach(item => {
        const itemTotal = item.product.price * item.quantity;
        grandTotal += itemTotal;

        const itemEl = document.createElement('div');
        itemEl.className = 'cart-item';
        itemEl.innerHTML = `
          <img src="${item.product.img}" alt="${item.product.title}" class="cart-item-img">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.product.title}</div>
            <div class="cart-item-price">NT$ ${item.product.price}</div>
            <div class="quantity-controls">
              <button class="qty-btn" onclick="updateQuantity(${item.product.id}, -1)">-</button>
              <span>${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity(${item.product.id}, 1)">+</button>
            </div>
          </div>
          <button class="remove-item" onclick="removeFromCart(${item.product.id})">移除</button>
        `;
        cartItemsContainer.appendChild(itemEl);
      });

      totalPriceEl.innerText = `NT$ ${grandTotal}`;
    }

    // 4. 電子訂單生成與轉發模組
    function generateInvoice() {
      if (cart.length === 0) {
        alert("購物車是空的，無法生成訂單！");
        return;
      }

      const now = new Date();
      const dateStr = now.toISOString().slice(0,10).replace(/-/g,"");
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      const orderId = `VIE-${dateStr}-${randomNum}`;
      
      let grandTotal = 0;
      let itemsText = "";

      cart.forEach((item, index) => {
        const subtotal = item.product.price * item.quantity;
        grandTotal += subtotal;
        itemsText += `${index + 1}. ${item.product.title} x${item.quantity} (NT$ ${subtotal})\n`;
      });

      currentInvoiceString = `================================
☕ VIEBUCKS 精品咖啡 訂單明細
================================
訂單編號：${orderId}
日期時間：${now.toLocaleString('zh-TW')}

【訂購商品】
${itemsText}
--------------------------------
總計金額：NT$ ${grandTotal}
================================
請填寫以下收件資訊並回覆此訊息：
姓名：
