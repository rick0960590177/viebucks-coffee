  <!-- Tailwind CSS CDN -->

  <script>

  <!-- React & Babel CDN -->

      { id: 'robusta-cb-30', name: '羅布斯塔 100% 冷萃包', nameVi: 'Cà phê Cold Brew Robusta 100%', category: 'robusta', spec: '30包/袋', price: 230000, wholesalePrice: 200000, type: 'coldbrew', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-jasmine-cb-10', name: 'Robusta 冷萃包 - 茉莉花風味', nameVi: 'Cà phê Cold Brew Robusta - Hương Hoa Nhài', category: 'robusta', spec: '10包/袋', price: 100000, wholesalePrice: 88000, type: 'coldbrew', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-jasmine-cb-30', name: 'Robusta 冷萃包 - 茉莉花風味', nameVi: 'Cà phê Cold Brew Robusta - Hương Hoa Nhài', category: 'robusta', spec: '30包/袋', price: 250000, wholesalePrice: 220000, type: 'coldbrew', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-honey-250g', name: '羅布斯塔蜂蜜蜜處理咖啡豆', nameVi: 'Cà phê Robusta Honey Process', category: 'robusta', spec: '250克', price: 105000, wholesalePrice: 90000, type: 'beans', image: 'https://images.unsplash.com/photo-1610632380989-680fe40816c6?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-honey-500g', name: '羅布斯塔蜂蜜蜜處理咖啡豆', nameVi: 'Cà phê Robusta Honey Process', category: 'robusta', spec: '500克', price: 200000, wholesalePrice: 170000, type: 'beans', image: 'https://images.unsplash.com/photo-1610632380989-680fe40816c6?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-honey-cb-10', name: '羅布斯塔蜂蜜蜜處理冷萃包', nameVi: 'Cà phê Cold Brew Robusta Honey', category: 'robusta', spec: '10包/袋', price: 95000, wholesalePrice: 82000, type: 'coldbrew', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&q=80&w=600' },
      { id: 'robusta-honey-cb-30', name: '羅布斯塔蜂蜜蜜處理冷萃包', nameVi: 'Cà phê Cold Brew Robusta Honey', category: 'robusta', spec: '30包/袋', price: 270000, wholesalePrice: 230000, type: 'coldbrew', image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&q=80&w=600' },

      // 拼配系列
      { id: 'blend-8020-250g', name: '經典精品義式拼配 80/20', nameVi: 'Cà phê Espresso Blend 80/20', category: 'blend', spec: '250克', price: 135000, wholesalePrice: 115000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' },
      { id: 'blend-8020-500g', name: '經典精品義式拼配 80/20', nameVi: 'Cà phê Espresso Blend 80/20', category: 'blend', spec: '500克', price: 260000, wholesalePrice: 220000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' },
      { id: 'blend-7030-250g', name: '商業義式平衡拼配 70/30', nameVi: 'Cà phê Commercial Blend 70/30', category: 'blend', spec: '250克', price: 128000, wholesalePrice: 110000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' },
      { id: 'blend-7030-500g', name: '商業義式平衡拼配 70/30', nameVi: 'Cà phê Commercial Blend 70/30', category: 'blend', spec: '500克', price: 245000, wholesalePrice: 210000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' },
      { id: 'blend-5050-250g', name: '南義風格醇厚拼配 50/50', nameVi: 'Cà phê Blend Phong Cách Nam Ý 50/50', category: 'blend', spec: '250克', price: 118000, wholesalePrice: 100000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' },
      { id: 'blend-5050-500g', name: '南義風格醇厚拼配 50/50', nameVi: 'Cà phê Blend Phong Cách Nam Ý 50/50', category: 'blend', spec: '500克', price: 225000, wholesalePrice: 190000, type: 'beans', image: 'https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&q=80&w=600' }
    ];

    function App() {
      // 狀態管理
      const [cart, setCart] = useState(() => {
        try {
          const savedCart = localStorage.getItem(CART_STORAGE_KEY);
          return savedCart ? JSON.parse(savedCart) : [];
        } catch (e) {
          return [];
        }
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);

      // 持久化購物車至 localStorage
      useEffect(() => {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      }, [cart]);

      // 搜尋與分類過濾
      const filteredProducts = useMemo(() => {
        return PRODUCTS.filter(product => {
          const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
          const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (product.nameVi && product.nameVi.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSearch;
        });
      }, [selectedCategory, searchQuery]);

      // 購物車操作邏輯
      const handleAddToCart = (productToAdd) => {
        setCart(prev => {
          const cartKey = `${productToAdd.id}-${productToAdd.grind || 'default'}`;
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item =>
              item.cartKey === cartKey
                ? { ...item, quantity: item.quantity + productToAdd.quantity }
                : item
            );
          }
          return [...prev, { ...productToAdd, cartKey }];
        });
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartKey === cartKey) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const clearCart = () => {
        setCart([]);
        localStorage.removeItem(CART_STORAGE_KEY);
      };

      const totalCartItems = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* 導覽列 */}
          <nav className="sticky top-0 z-30 bg-coffee-900 text-coffee-100 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <Coffee className="h-8 w-8 text-coffee-200" />
                <span className="text-2xl font-bold tracking-wider font-serif">AROMA CAFE</span>
              </div>

              {/* 搜尋列 */}
              <div className="relative flex-1 max-w-md hidden md:block">
                <input
                  type="text"
                  placeholder="搜尋產品中文或越南文名稱..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-coffee-800 text-coffee-100 placeholder-coffee-200/60 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-coffee-200 border border-coffee-800 text-sm"
                />
                <Search className="absolute left-3 top-2.5 h-4 w-4 text-coffee-200/60" />
              </div>

              {/* 操作按鈕 */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsHistoryOpen(true)}
                  className="p-2 hover:bg-coffee-800 rounded-full transition-colors text-coffee-200 hover:text-white"
                  title="歷史訂單"
                >
                  <Clock className="h-6 w-6" />
                </button>
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2 hover:bg-coffee-800 rounded-full transition-colors"
                >
                  <ShoppingBag className="h-7 w-7 text-coffee-100" />
                  {totalCartItems > 0 && (
                    <span className="absolute -top-1 -right-1 bg-amber-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center animate-pulse">
                      {totalCartItems}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </nav>

          {/* 英雄橫幅 */}
          <header className="relative bg-coffee-900 text-coffee-100 py-20 px-4 text-center overflow-hidden">
            <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&q=80&w=1600')] bg-cover bg-center"></div>
            <div className="relative max-w-3xl mx-auto space-y-3">
              <h1 className="text-3xl sm:text-5xl font-extrabold font-serif tracking-wide">越南原產精品咖啡</h1>
              <p className="text-coffee-200 text-base sm:text-lg font-light">
                批發與零售服務 • 滿 10 包自動升級批發價 • 滿 500,000 VND 免運費
              </p>
            </div>
          </header>

          {/* 主要內容區 */}
          <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
            {/* 分類切換 */}
            <div className="flex flex-wrap gap-3 justify-center mb-8">
              {[
                { id: 'all', label: '全部分類' },
                { id: 'arabica', label: '1. 阿拉比卡 (Arabica)' },
                { id: 'robusta', label: '2. 羅布斯塔 (Robusta)' },
                { id: 'blend', label: '3. 拼配咖啡 (Blend)' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setSelectedCategory(tab.id)}
                  className={`px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 ${
                    selectedCategory === tab.id
                      ? 'bg-coffee-800 text-coffee-50 shadow-md'
                      : 'bg-coffee-100 text-coffee-800 hover:bg-coffee-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* 商品卡片區 */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProducts.map(product => (
                <div key={product.id} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-coffee-100 flex flex-col">
                  <div className="h-52 overflow-hidden relative bg-coffee-100">
                    <img src={product.image} alt={product.name} className="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
                    <span className="absolute top-3 right-3 text-xs bg-coffee-900/80 text-white px-2.5 py-1 rounded-full backdrop-blur-md">
                      {product.spec}
                    </span>
                  </div>
                  <div className="p-5 flex flex-col flex-grow justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-coffee-900 font-serif">{product.name}</h3>
                      <p className="text-xs text-coffee-600 italic mb-3">{product.nameVi}</p>
                    </div>

                    <div className="pt-4 border-t border-coffee-100 space-y-3">
                      <div className="flex items-baseline justify-between">
                        <div>
                          <div className="text-xs text-coffee-500">零售價</div>
                          <div className="text-lg font-bold text-coffee-900">{product.price.toLocaleString()} VND</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xs text-amber-700 font-bold">批發價 (10包+)</div>
                          <div className="text-sm font-bold text-amber-800">{product.wholesalePrice.toLocaleString()} VND</div>
                        </div>
                      </div>

                      <button
                        onClick={() => setSelectedProduct(product)}
                        className="w-full bg-coffee-800 hover:bg-coffee-900 text-white py-2.5 rounded-xl text-sm font-medium transition-colors flex items-center justify-center gap-2"
                      >
                        <Plus className="h-4 w-4" /> 選擇與購買
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* 1. 商品細節彈窗 (含研磨度選擇) */}
          {selectedProduct && (
            <ProductDetailModal
              product={selectedProduct}
              onClose={() => setSelectedProduct(null)}
              onAddToCart={handleAddToCart}
            />
          )}

          {/* 2. 購物車側邊抽屜 */}
          {isCartOpen && (
            <CartDrawer
              isOpen={isCartOpen}
              onClose={() => setIsCartOpen(false)}
              cart={cart}
              updateQuantity={updateQuantity}
              onOpenCheckout={() => {
                setIsCartOpen(false);
                setIsCheckoutOpen(true);
              }}
            />
          )}

          {/* 3. 結帳與收件地址彈窗 */}
          {isCheckoutOpen && (
            <CheckoutModal
              isOpen={isCheckoutOpen}
              onClose={() => setIsCheckoutOpen(false)}
              cart={cart}
              clearCart={clearCart}
            />
          )}

          {/* 4. 歷史訂單紀錄彈窗 */}
          {isHistoryOpen && (
            <OrderHistoryModal
              isOpen={isHistoryOpen}
              onClose={() => setIsHistoryOpen(false)}
            />
          )}

        </div>
      );
    }

    // --- 子元件 1: 商品細節與研磨選擇 Modal ---
    function ProductDetailModal({ product, onClose, onAddToCart }) {
      const [quantity, setQuantity] = useState(1);
      const [selectedGrind, setSelectedGrind] = useState('beans');

      const isBeanProduct = product.type === 'beans';
      const currentUnitPrice = quantity >= 10 ? product.wholesalePrice : product.price;

      const handleAdd = () => {
        const grindObj = GRIND_OPTIONS.find(g => g.id === selectedGrind);
        onAddToCart({
          ...product,
          quantity,
          grind: isBeanProduct ? selectedGrind : 'coldbrew',
          grindLabel: isBeanProduct ? grindObj.label : '冷萃包'
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
          <div className="flex min-h-full items-center justify-center p-4">
            <div className="relative w-full max-w-xl bg-coffee-50 rounded-2xl shadow-2xl border border-coffee-200 overflow-hidden text-left">
              <button onClick={onClose} className="absolute right-4 top-4 z-10 p-2 bg-white/80 rounded-full hover:bg-white text-coffee-900">
                <X className="h-5 w-5" />
              </button>

              <div className="p-6 space-y-6">
                <div>
                  <span className="text-xs font-bold text-coffee-600 uppercase">{product.spec}</span>
                  <h2 className="text-2xl font-bold font-serif text-coffee-900">{product.name}</h2>
                  <p className="text-xs text-coffee-600 italic">{product.nameVi}</p>
                </div>

                <div className="flex items-baseline gap-3 bg-white p-4 rounded-xl border border-coffee-100">
                  <span className="text-2xl font-extrabold text-coffee-800">
                    {currentUnitPrice.toLocaleString()} VND
                  </span>
                  {quantity >= 10 ? (
                    <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">
                      已享批發優惠價
                    </span>
                  ) : (
                    <span className="text-xs text-coffee-500">
                      (再加 {10 - quantity} 包升級批發價)
                    </span>
                  )}
                </div>

                {/* 研磨度選擇 */}
                {isBeanProduct ? (
                  <div className="space-y-2">
                    <label className="text-xs font-bold uppercase text-coffee-800 flex items-center gap-1">
                      <Settings2 className="h-3.5 w-3.5" /> 選擇研磨度 (Grind Size)
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {GRIND_OPTIONS.map(g => (
                        <button
                          key={g.id}
                          onClick={() => setSelectedGrind(g.id)}
                          className={`p-3 rounded-lg text-left border transition-all ${
                            selectedGrind === g.id
                              ? 'bg-coffee-800 text-white border-coffee-800'
                              : 'bg-white text-coffee-800 border-coffee-200 hover:border-coffee-400'
                          }`}
                        >
                          <div className="text-xs font-bold">{g.label}</div>
                          <div className="text-[10px] opacity-75">{g.detail}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="p-3 bg-coffee-100 rounded-lg text-xs text-coffee-700">
                    本商品為獨立冷萃浸泡包，免選擇研磨度。
                  </div>
                )}

                {/* 數量選擇 */}
                <div className="flex items-center justify-between pt-2">
                  <span className="text-sm font-bold text-coffee-900">數量</span>
                  <div className="flex items-center rounded-lg border border-coffee-300 bg-white p-1">
                    <button onClick={() => setQuantity(q => Math.max(1, q - 1))} className="p-1.5 hover:bg-coffee-100 rounded">
                      <Minus className="h-4 w-4" />
                    </button>
                    <span className="w-8 text-center text-sm font-bold">{quantity}</span>
                    <button onClick={() => setQuantity(q => q + 1)} className="p-1.5 hover:bg-coffee-100 rounded">
                      <Plus className="h-4 w-4" />
                    </button>
                  </div>
                </div>

                <button
                  onClick={handleAdd}
                  className="w-full bg-coffee-800 hover:bg-coffee-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                >
                  <ShoppingBag className="h-4 w-4" /> 加入購物車 • {(currentUnitPrice * quantity).toLocaleString()} VND
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 子元件 2: 購物車 Drawer ---
    function CartDrawer({ isOpen, onClose, cart, updateQuantity, onOpenCheckout }) {
      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;
      const amountNeeded = Math.max(0, SHIPPING_CONFIG.FREE_THRESHOLD - subtotal);
      const progress = Math.min(100, (subtotal / SHIPPING_CONFIG.FREE_THRESHOLD) * 100);

      return (
        <div className="fixed inset-0 z-50 overflow-hidden">
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose} />
          <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
            <div className="w-screen max-w-md bg-coffee-50 text-coffee-900 shadow-2xl flex flex-col">
              
              <div className="p-6 bg-coffee-900 text-coffee-100 flex items-center justify-between">
                <h2 className="text-xl font-bold flex items-center gap-2 font-serif">
                  <ShoppingBag className="h-5 w-5" /> 您的購物車
                </h2>
                <button onClick={onClose} className="p-1 hover:bg-coffee-800 rounded-full">
                  <X className="h-6 w-6" />
                </button>
              </div>

              {/* 免運進度條 */}
              <div className="bg-coffee-100 p-4 border-b border-coffee-200">
                <div className="flex items-center justify-between text-xs font-semibold text-coffee-800 mb-1.5">
                  <span className="flex items-center gap-1"><Truck className="h-4 w-4" /> 滿 500,000 VND 免運</span>
                  <span>{isFreeShipping ? '已達免運門檻！' : `還差 ${amountNeeded.toLocaleString()} VND`}</span>
                </div>
                <div className="w-full bg-coffee-200 rounded-full h-2 overflow-hidden">
                  <div className="bg-amber-700 h-full transition-all duration-300" style={{ width: `${progress}%` }} />
                </div>
              </div>

              {/* 商品列表 */}
              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {cart.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-coffee-600">
                    <p>購物車目前是空的</p>
                  </div>
                ) : (
                  cart.map(item => {
                    const unitPrice = getUnitPrice(item);
                    return (
                      <div key={item.cartKey} className="p-3 bg-white rounded-xl shadow-sm border border-coffee-100 space-y-2">
                        <div className="flex items-start gap-3">
                          <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-lg flex-shrink-0" />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-coffee-900 text-sm truncate">{item.name}</h4>
                            <p className="text-xs text-coffee-600">規格: {item.spec} | 研磨: {item.grindLabel}</p>
                            <div className="mt-1 flex items-center gap-2">
                              <span className="text-xs font-bold text-coffee-800">{unitPrice.toLocaleString()} VND</span>
                              {item.quantity >= 10 && <span className="text-[10px] bg-amber-100 text-amber-800 px-1 rounded font-bold">批發價</span>}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-2 border-t border-coffee-50">
                          <div className="flex items-center gap-2 bg-coffee-100 rounded-lg p-1">
                            <button onClick={() => updateQuantity(item.cartKey, -1)} className="p-1 hover:bg-coffee-200 rounded"><Minus className="h-3 w-3" /></button>
                            <span className="text-xs font-bold w-6 text-center">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.cartKey, 1)} className="p-1 hover:bg-coffee-200 rounded"><Plus className="h-3 w-3" /></button>
                          </div>
                          <div className="text-right font-bold text-xs">
                            {(unitPrice * item.quantity).toLocaleString()} VND
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {/* 結帳按鈕頁尾 */}
              {cart.length > 0 && (
                <div className="p-6 bg-white border-t border-coffee-100 space-y-3">
                  <div className="space-y-1 text-sm text-coffee-700">
                    <div className="flex justify-between"><span>商品小計</span><span>{subtotal.toLocaleString()} VND</span></div>
                    <div className="flex justify-between"><span>運費</span><span>{isFreeShipping ? '免費' : `${shippingFee.toLocaleString()} VND`}</span></div>
                    <div className="flex justify-between font-bold text-base text-coffee-900 pt-2 border-t border-coffee-100">
                      <span>總計金額</span><span className="text-xl text-coffee-800">{grandTotal.toLocaleString()} VND</span>
                    </div>
                  </div>

                  <button
                    onClick={onOpenCheckout}
                    className="w-full bg-coffee-800 hover:bg-coffee-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <Send className="h-4 w-4" /> 前往填寫收件資訊結帳
                  </button>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    // --- 子元件 3: 收件人地址與發送 Modal ---
    function CheckoutModal({ isOpen, onClose, cart, clearCart }) {
      const [formData, setFormData] = useState({ fullName: '', phone: '', address: '', notes: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);

      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;

      const handleInputChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmitOrder = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const orderSummaryText = cart.map((item, idx) => {
          const unitPrice = getUnitPrice(item);
          return `${idx + 1}. ${item.name} (${item.spec}) - 研磨: ${item.grindLabel} x ${item.quantity}包 = ${(unitPrice * item.quantity).toLocaleString()} VND`;
        }).join('\n');

        const orderId = Date.now().toString().slice(-6);
        const orderRecord = {
          id: orderId,
          date: new Date().toLocaleString('zh-TW'),
          customerName: formData.fullName,
          phone: formData.phone,
          address: formData.address,
          notes: formData.notes,
          items: cart.map(item => ({
            name: item.name,
            spec: item.spec,
            grindLabel: item.grindLabel,
            quantity: item.quantity,
            unitPrice: getUnitPrice(item)
          })),
          subtotal,
          shippingFee,
          grandTotal
        };

        try {
          // 透過 Formspree/Email 發送訂單至目標 Email
          await fetch('https://formspree.io/f/xbjnqpyw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              target_email: 'rick0960590177@gmail.com',
              order_id: orderId,
              customer_name: formData.fullName,
              customer_phone: formData.phone,
              shipping_address: formData.address,
              order_notes: formData.notes || '無',
              order_summary: orderSummaryText,
              total_amount: `${grandTotal.toLocaleString()} VND`,
              order_date: orderRecord.date
            })
          });

          // 寫入本地歷史紀錄
          const history = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
          localStorage.setItem(ORDER_HISTORY_STORAGE_KEY, JSON.stringify([orderRecord, ...history]));

          setIsSuccess(true);
          clearCart();
          setTimeout(() => {
            setIsSuccess(false);
            onClose();
          }, 3000);
        } catch (error) {
          alert('訂單傳送失敗，請再試一次');
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
          <div className="flex min-h-full items-center justify-center p-4">
            <div className="relative w-full max-w-lg bg-coffee-50 rounded-2xl shadow-2xl border border-coffee-200 overflow-hidden text-left p-6 md:p-8">
              <button onClick={onClose} className="absolute right-4 top-4 p-2 bg-white/80 rounded-full hover:bg-white text-coffee-900">
                <X className="h-5 w-5" />
              </button>

              {isSuccess ? (
                <div className="py-10 text-center space-y-4">
                  <CheckCircle2 className="h-16 w-16 text-green-600 mx-auto animate-bounce" />
                  <h3 className="text-2xl font-bold font-serif text-coffee-900">訂單已成功送出！</h3>
                  <p className="text-sm text-coffee-600">
                    訂單已自動寄送至 <span className="font-bold text-coffee-800">rick0960590177@gmail.com</span>。
                  </p>
                </div>
              ) : (
                <form onSubmit={handleSubmitOrder} className="space-y-4">
                  <h2 className="text-2xl font-bold font-serif text-coffee-900">收件人資訊</h2>

                  <div>
                    <label className="block text-xs font-bold text-coffee-800 mb-1">姓名 *</label>
                    <input type="text" name="fullName" required value={formData.fullName} onChange={handleInputChange} className="w-full bg-white border border-coffee-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-800" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-coffee-800 mb-1">聯絡電話 *</label>
                    <input type="tel" name="phone" required value={formData.phone} onChange={handleInputChange} className="w-full bg-white border border-coffee-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-800" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-coffee-800 mb-1">收件地址 *</label>
                    <input type="text" name="address" required value={formData.address} onChange={handleInputChange} className="w-full bg-white border border-coffee-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-800" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-coffee-800 mb-1">備註 (可選)</label>
                    <textarea name="notes" rows={2} value={formData.notes} onChange={handleInputChange} className="w-full bg-white border border-coffee-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-800" />
                  </div>

                  <div className="bg-coffee-100 p-4 rounded-xl space-y-1 text-sm font-bold text-coffee-900">
                    <div className="flex justify-between"><span>應付金額:</span><span className="text-lg text-coffee-800">{grandTotal.toLocaleString()} VND</span></div>
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full bg-coffee-800 hover:bg-coffee-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                  >
                    <Send className="h-4 w-4" /> {isSubmitting ? '正在傳送訂單...' : '確認發送訂單'}
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- 子元件 4: 歷史訂單 Modal ---
    function OrderHistoryModal({ isOpen, onClose }) {
      const [history, setHistory] = useState([]);

      useEffect(() => {
        const saved = localStorage.getItem(ORDER_HISTORY_STORAGE_KEY);
        setHistory(saved ? JSON.parse(saved) : []);
      }, [isOpen]);

      const clearHistory = () => {
        if (confirm('確定要清除所有歷史訂單紀錄？')) {
          localStorage.removeItem(ORDER_HISTORY_STORAGE_KEY);
          setHistory([]);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
          <div className="flex min-h-full items-center justify-center p-4">
            <div className="relative w-full max-w-xl bg-coffee-50 rounded-2xl shadow-2xl border border-coffee-200 overflow-hidden text-left p-6">
              <div className="flex justify-between items-center mb-4 border-b border-coffee-200 pb-3">
                <h2 className="text-xl font-bold font-serif text-coffee-900 flex items-center gap-2">
                  <Package className="h-5 w-5" /> 歷史訂單紀錄
                </h2>
                <div className="flex items-center gap-2">
                  {history.length > 0 && (
                    <button onClick={clearHistory} className="text-xs text-red-600 hover:underline flex items-center gap-1">
                      <Trash2 className="h-3.5 w-3.5" /> 清除歷史
                    </button>
                  )}
                  <button onClick={onClose} className="p-1 rounded-full hover:bg-coffee-200"><X className="h-5 w-5" /></button>
                </div>
              </div>

              <div className="max-h-[60vh] overflow-y-auto space-y-3">
                {history.length === 0 ? (
                  <p className="text-center py-8 text-sm text-coffee-600">尚無歷史訂單紀錄</p>
                ) : (
                  history.map(item => (
                    <div key={item.id} className="bg-white p-4 rounded-xl border border-coffee-100 space-y-2 text-xs">
                      <div className="flex justify-between font-bold text-coffee-900">
                        <span>訂單編號: #{item.id}</span>
                        <span className="text-coffee-600">{item.date}</span>
                      </div>
                      <div className="text-coffee-700">收件人: {item.customerName} ({item.phone})</div>
                      <div className="bg-coffee-50 p-2 rounded space-y-1">
                        {item.items.map((prod, idx) => (
                          <div key={idx} className="flex justify-between text-coffee-800">
                            <span>{prod.name} ({prod.spec}) - {prod.grindLabel}</span>
                            <span>x{prod.quantity}</span>
                          </div>
                        ))}
                      </div>
                      <div className="text-right font-bold text-sm text-coffee-900">
                        總額: {item.grandTotal.toLocaleString()} VND
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
